name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_TAG="v${PKG_VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            if [[ "${RELEASE_TAG}" != "${PKG_TAG}" ]]; then
              echo "Tag (${RELEASE_TAG}) does not match package.json version (${PKG_TAG})."
              exit 1
            fi
          else
            RELEASE_TAG="${PKG_TAG}"
          fi

          echo "new_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate types
        run: pnpm compile

      - name: Build and zip (Chrome + Firefox)
        run: pnpm zip && pnpm zip:firefox

      # --- Optional store publishing (disabled by default) ---
      # To enable Firefox (AMO) publishing:
      # 1) Create an AMO developer account: https://addons.mozilla.org/developers/
      # 2) Create API credentials in AMO Developer Hub.
      # 3) Add these repository secrets:
      #    - AMO_JWT_ISSUER
      #    - AMO_JWT_SECRET
      # 4) Uncomment the step below and set your extension ID.
      #
      # - name: Publish to Firefox Add-ons (AMO)
      #   env:
      #     AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      #     AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      #   run: |
      #     pnpm dlx web-ext sign \
      #       --source-dir .output/firefox-mv2 \
      #       --channel listed \
      #       --amo-metadata . \
      #       --api-key "$AMO_JWT_ISSUER" \
      #       --api-secret "$AMO_JWT_SECRET"
      #
      # To enable Chrome Web Store publishing:
      # 1) Create a Chrome Web Store developer account.
      # 2) Create OAuth credentials and refresh token.
      # 3) Add these repository secrets:
      #    - CWS_EXTENSION_ID
      #    - CWS_CLIENT_ID
      #    - CWS_CLIENT_SECRET
      #    - CWS_REFRESH_TOKEN
      # 4) Uncomment the step below.
      #
      # - name: Publish to Chrome Web Store
      #   env:
      #     EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      #     CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      #     CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      #     REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      #   run: |
      #     set -- .output/*chrome*.zip
      #     ZIP_PATH="$1"
      #     pnpm dlx chrome-webstore-upload-cli upload \
      #       --source "$ZIP_PATH" \
      #       --extension-id "$EXTENSION_ID" \
      #       --client-id "$CLIENT_ID" \
      #       --client-secret "$CLIENT_SECRET" \
      #       --refresh-token "$REFRESH_TOKEN" \
      #       --auto-publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            .output/*.zip
